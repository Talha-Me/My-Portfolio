<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cv-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#cv-bg)"/>

  <!-- Top Browser Bar -->
  <rect x="0" y="0" width="800" height="40" fill="#ffffff"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#10b981"/>
  <rect x="180" y="7" width="440" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="400" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">🔒 https://civic.talhabyte.dev/emergency/donor-radar</text>

  <!-- Left: Proximity Blood Radar Map -->
  <g transform="translate(30, 65)" filter="url(#cv-shadow)">
    <rect width="360" height="380" rx="20" fill="#ffffff" stroke="#fecdd3"/>
    
    <!-- Radar Canvas -->
    <g transform="translate(180, 180)">
      <circle r="130" fill="#fff1f2" stroke="#fda4af" stroke-dasharray="4 4"/>
      <circle r="90" fill="#ffe4e6" stroke="#f43f5e" stroke-dasharray="4 4"/>
      <circle r="45" fill="#fecdd3" stroke="#e11d48"/>
      
      <!-- Radar Sweep Beam Vector -->
      <polygon points="0,0 120,-40 130,-10" fill="#e11d48" opacity="0.15"/>
      <line x1="0" y1="0" x2="125" y2="-25" stroke="#e11d48" stroke-width="2"/>

      <!-- Center Patient -->
      <circle r="10" fill="#e11d48"/>
      <circle r="4" fill="#ffffff"/>

      <!-- Nearby Donors (Dots) -->
      <g transform="translate(60, -35)">
        <circle r="7" fill="#10b981"/>
        <text x="0" y="-10" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">O+ (1.2 km)</text>
      </g>
      <g transform="translate(-75, 40)">
        <circle r="7" fill="#10b981"/>
        <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">B+ (1.8 km)</text>
      </g>
      <g transform="translate(30, 70)">
        <circle r="7" fill="#10b981"/>
        <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">O+ (2.1 km)</text>
      </g>
    </g>

    <!-- Radar Footer Banner -->
    <rect x="20" y="325" width="320" height="36" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="180" y="347" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">🎯 3 Verified Compatible Donors in Proximity</text>
  </g>

  <!-- Right: Dispatch Alert & Social Pledge -->
  <g transform="translate(415, 65)" filter="url(#cv-shadow)">
    <rect width="355" height="380" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
    
    <g transform="translate(20, 24)">
      <rect width="110" height="22" rx="6" fill="#fee2e2"/>
      <text x="55" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#dc2626" text-anchor="middle">EMERGENCY ALERT</text>

      <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0f172a">Immediate Blood Request</text>
      <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Location: Mugda Medical College, Dhaka</text>

      <!-- SMS & WhatsApp Dispatch Box -->
      <g transform="translate(0, 88)">
        <rect width="315" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Automated Twilio & WhatsApp Dispatch</text>
        <rect x="16" y="36" width="283" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="24" y="54" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" fill="#334155">"URGENT: 2 Bags of O+ Blood needed.</text>
        <text x="24" y="68" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" fill="#334155">Respond 1 to Accept Dispatch."</text>
        
        <rect x="16" y="84" width="90" height="18" rx="4" fill="#dcfce7"/>
        <text x="61" y="97" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">✓ SMS Sent (3)</text>
      </g>

      <!-- 100% Client Funded Social Pledge Box -->
      <g transform="translate(0, 218)">
        <rect width="315" height="110" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#065f46">✦ 100% Social Reinvestment Pledge</text>
        <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#047857" leading="14">
          <tspan x="16" dy="0">This civic platform operates 100% free of charge</tspan>
          <tspan x="16" dy="14">for all citizens. Financed entirely by commercial proceeds</tspan>
          <tspan x="16" dy="14">from Talhabyte IT enterprise client contracts.</tspan>
        </text>
        <rect x="16" y="80" width="140" height="20" rx="6" fill="#059669"/>
        <text x="86" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Zero Ads · Zero Fees</text>
      </g>
    </g>
  </g>
</svg>
